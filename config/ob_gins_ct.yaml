# Processing time parameters
windows: 50
starttime: 1
endtime: 90
aligntime: 3
kf_interval_sec: 0.1

# Solver and Physics
num_iterations: 2
isearth: true

# Debug and Comparison
debug:
  enable: true
  level: 1

comparison:
  enable: true
  python_script: "./plot_ct_results.py"
  truth_file: "D:/Code/dataset/WID/Datasets/transformedData2/four_wheel_dataset_PassengerCar/trial01/GNSS_use.txt"
