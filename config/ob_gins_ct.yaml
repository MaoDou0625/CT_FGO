# OB_GINS Continuous Time Configuration (Ref: wid.yaml)

# Data files
gnssfile: "D:/Code/dataset/WID/Datasets/transformedData2/four_wheel_dataset_PassengerCar/trial01/GNSS_use.txt"
outputpath: "D:/Code/dataset/WID/Datasets/transformedData2/output4"
save_multi_imu: true

# Main Body IMU
imu_main:
  type: "standard"
  file: "D:/Code/dataset/WID/Datasets/transformedData2/four_wheel_dataset_PassengerCar/trial01/Body_IMU.txt"
  columns: 7
  rate_hz: 120
  antlever: [ 0.0, 0.0, 0.0 ]
  imunoise:
    accel_noise: 25      # ug/sqrt(Hz)
    gyro_noise:  0.004     # deg/s/sqrt(Hz)
    accel_bias_rw: 5    # ug (Bias Instability)
    gyro_bias_rw:  1     # deg/h (Bias Instability)
    accel_corr_time: 3600.0 # s
    gyro_corr_time: 3600.0  # s

# Wheel IMUs
center_imu1:
  type: "wheel"
  side: "left"
  file: "D:/Code/dataset/WID/Datasets/transformedData2/four_wheel_dataset_PassengerCar/trial01/Center_IMU1.txt"
  columns: 9
  rate_hz: 120
  antlever: [ 2.32, 0.7180, 1.4]
  odolever: [ 0.0, 0.0, 0.0 ]
  extrinsic_rotation: [ 0.0, 0.0, 0.0 ] # RPY in degrees
  wheel_radius: 0.3
  speed_weight: 10.0
  nhc_weight: 10.0
  attitude_weight_roll: 100.0
  attitude_weight_yaw: 1.0  # Front Left (Steering)
  imunoise:
    accel_noise: 120      # ug/sqrt(Hz)
    gyro_noise:  0.007     # deg/s/sqrt(Hz)
    accel_bias_rw: 20    # ug (Bias Instability)
    gyro_bias_rw:  10     # deg/h (Bias Instability)
    accel_corr_time: 3600.0
    gyro_corr_time: 3600.0

