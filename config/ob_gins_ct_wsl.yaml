# Processing time parameters
windows: 50
starttime: 1
endtime: 120
aligntime: 3
kf_interval_sec: 0.1

# Solver and Physics
num_iterations: 50
isearth: true

# Debug and Comparison
debug:
  enable: true
  level: 1

comparison:
  enable: true
  python_script: "/mnt/d/Code/OB_GINS_Liu/plot_ct_results.py"
  truth_file: "/mnt/d/Code/dataset/WID/Datasets/transformedData2/four_wheel_dataset_PassengerCar/trial01/GNSS_use.txt"
  label: "OB_GINS_CT"
